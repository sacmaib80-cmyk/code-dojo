/* predict */
function renderPredict(ex, body, j){
  const st = exSt(ex.id);
  body.appendChild(codePre(ex.code));
  const lines = ex.answer.split("\n").length;
  const q = document.createElement("div");
  q.innerHTML = `<p style="margin:8px 0 6px">โปรแกรมนี้พิมพ์อะไรออกมา? ${lines > 1 ? "<b>(" + lines + " บรรทัด — ตอบบรรทัดละค่า)</b>" : ""} <span class="dim" style="color:var(--dim);font-size:12.5px">ห้ามรันในหัวแบบเดา — ไล่ทีละบรรทัดเหมือนเป็น CPU</span></p>`;
  body.appendChild(q);
  const ta = document.createElement("textarea");
  ta.className = "answerIn"; ta.rows = Math.max(1, lines); ta.style.resize = "vertical";
  ta.placeholder = lines > 1 ? "บรรทัดละหนึ่งค่า" : "คำตอบ";
  if(st.done) ta.value = ex.answer;
  body.appendChild(ta);
  const row = document.createElement("div"); row.className = "runRow";
  const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "ตรวจ";
  row.appendChild(btn); body.appendChild(row);
  const out = document.createElement("div"); body.appendChild(out);
  if(st.done){ btn.disabled = true; out.appendChild(coachBox(ex.why, true)); passUI(ex, body, j); }
  /* เทียบคำตอบแบบใจกว้าง: คอนโซลจริงพิมพ์อาร์เรย์เป็น [1, 10, 22, 9] (มีวงเล็บ+เว้นวรรค)
     ถ้าเทียบตรงตัวเป๊ะ คนตอบถูกก็โดนตีตก — ตัดวงเล็บ/ช่องว่างรอบคอมมา/อัญประกาศออกทั้งสองฝั่ง */
  function norm(s){
    return String(s).split("\n").map(x=>{
      let v = x.trim()
        .replace(/^(?:Array|Object)?\s*\(\d+\)\s*/, "")  // หัวแบบ DevTools: (4) หรือ Array(4)
        .replace(/^["']+|["']+$/g, "")
        .replace(/\s+/g, " ").trim();
      if(/^\[.*\]$/.test(v)) v = v.slice(1, -1).trim();  // [1, 2] → 1, 2
      if(v.indexOf(",") >= 0){
        v = v.split(",").map(p=>p.trim().replace(/^["']+|["']+$/g, "")).join(",");  // 1, 2 → 1,2
      }
      return v.trim();
    }).filter(x=>x !== "").join("\n");
  }
  btn.addEventListener("click", ()=>{
    if(st.done) return;
    st.tries++; saveS();
    out.innerHTML = "";
    const ok = norm(ta.value) === norm(ex.answer) || (ex.accept || []).some(a=>norm(ta.value) === norm(a));
    if(ok){
      solve(ex, j);
      out.appendChild(coachBox(ex.why, true));
      btn.disabled = true;
      passUI(ex, body, j);
    } else {
      out.appendChild(coachBox(`ยังไม่ใช่ (ครั้งที่ ${st.tries}) — <b>คำใบ้:</b> ${ex.nudge}`));
    }
  });
  ta.addEventListener("keydown", e=>{ if(e.key === "Enter" && !e.shiftKey && lines === 1){ e.preventDefault(); btn.click(); } });
}

/* mcq */
function renderMcq(ex, body, j){
  const st = exSt(ex.id);
  const wrap = document.createElement("div"); wrap.className = "mcq";
  ex.choices.forEach((c,k)=>{
    const b = document.createElement("button"); b.textContent = c;
    if(st.done && k === ex.ok) b.classList.add("right");
    b.addEventListener("click", ()=>{
      if(st.done) return;
      st.tries++; saveS();
      out.innerHTML = "";
      if(k === ex.ok){
        b.classList.add("right");
        solve(ex, j);
        out.appendChild(coachBox(ex.why, true));
        passUI(ex, body, j);
      } else {
        b.classList.add("wrong");
        out.appendChild(coachBox(`ยังไม่ใช่ — <b>คำใบ้:</b> ${ex.nudge}`));
      }
    });
    wrap.appendChild(b);
  });
  body.appendChild(wrap);
  const out = document.createElement("div"); body.appendChild(out);
  if(st.done){ out.appendChild(coachBox(ex.why, true)); passUI(ex, body, j); }
}

/* blank — เติมช่องว่าง (ใช้ได้ทั้งเติมโฟลว์ชาร์ต และเติมโค้ด) */
function blankNorm(s){ return String(s).trim().replace(/\s+/g," ").replace(/^["'`]+|["'`]+$/g,""); }
function blankOK(bl, val){
  const g = blankNorm(val);
  if(g === "") return false;
  const cands = [bl.ans].concat(bl.accept || []);
  return cands.some(c=> bl.ci ? blankNorm(c).toLowerCase() === g.toLowerCase() : blankNorm(c) === g);
}
function renderBlank(ex, body, j){

      html = html.replace("{{" + k + "}}", `<select class="blankIn blankSel" data-k="${k}"${st.done ? " disabled" : ""}>${opts}</select>`);

      const w = bl.size ? ` style="width:${bl.size}px"` : "";
      html = html.replace("{{" + k + "}}", `<input class="blankIn" data-k="${k}"${w}${val} placeholder="?" spellcheck="false">`);
    }
  });
  holder.innerHTML = html;
  body.appendChild(holder);

  const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "ตรวจ";
  row.appendChild(btn); body.appendChild(row);
  const out = document.createElement("div"); body.appendChild(out);
  if(st.done){ btn.disabled = true; out.appendChild(coachBox(ex.why, true)); passUI(ex, body, j); }
  btn.addEventListener("click", ()=>{
    if(st.done) return;
    st.tries++; saveS();
    out.innerHTML = "";
    let bad = 0;
    holder.querySelectorAll(".blankIn").forEach(inp=>{
      const k = +inp.getAttribute("data-k");
      const good = blankOK(ex.blanks[k], inp.value);
      inp.classList.toggle("ok", good); inp.classList.toggle("bad", !good);
      if(!good) bad++;
    });
    if(bad === 0){

    }
  });
}

/* ---------- code editor: พฤติกรรมวงเล็บ/ย่อหน้าเหมือน VS Code ---------- */
const PAIR_OPEN = {"(":")", "[":"]", "{":"}", '"':'"', "'":"'", "`":"`"};
const PAIR_CLOSE = {")":"(", "]":"[", "}":"{"};
function wireCodeEditor(ta, onRun){
  function setVal(v, caret){
    ta.value = v;
    ta.selectionStart = ta.selectionEnd = caret;
  }
  ta.addEventListener("keydown", e=>{
    const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
    /* Ctrl/Cmd+Enter = รันเทสต์ */
    if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); if(onRun) onRun(); return; }
    /* Alt+Shift+ลูกศรลง/ขึ้น = ก๊อปบรรทัดนั้นซ้ำ (เหมือน VS Code)
       ถ้าเลือกคลุมหลายบรรทัด จะก๊อปทั้งก้อน */
    if(e.altKey && e.shiftKey && (e.key === "ArrowDown" || e.key === "ArrowUp")){
      e.preventDefault();
      const lineStart = (s === 0) ? 0 : v.lastIndexOf("\n", s - 1) + 1;
      let lineEnd = v.indexOf("\n", en);
      if(lineEnd === -1) lineEnd = v.length;
      const block = v.slice(lineStart, lineEnd);
      ta.value = v.slice(0, lineEnd) + "\n" + block + v.slice(lineEnd);
      /* ลง = เคอร์เซอร์ตามไปสำเนาใหม่ · ขึ้น = เคอร์เซอร์อยู่บรรทัดบน (สำเนาอยู่ล่าง ผลลัพธ์เหมือน VS Code) */
      const shift = (e.key === "ArrowDown") ? block.length + 1 : 0;
      ta.selectionStart = s + shift;
      ta.selectionEnd = en + shift;
      return;
    }
    /* Tab = ย่อหน้า 2 ช่อง */
    if(e.key === "Tab"){
      e.preventDefault();
      setVal(v.slice(0,s) + "  " + v.slice(en), s + 2);
      return;
    }
    /* พิมพ์ตัวปิดทับตัวปิดที่มีอยู่แล้ว → ข้ามผ่าน (ไม่พิมพ์ซ้ำ) เหมือน VS Code */
    if((e.key === ")" || e.key === "]" || e.key === "}" || e.key === '"' || e.key === "'" || e.key === "`") && s === en && v[s] === e.key){
      e.preventDefault();
      ta.selectionStart = ta.selectionEnd = s + 1;
      return;
    }
    /* พิมพ์ตัวเปิด → ปิดให้อัตโนมัติ (เคอร์เซอร์อยู่ตรงกลาง) / มี selection → ห่อไว้ */
    if(PAIR_OPEN[e.key] !== undefined){
      const close = PAIR_OPEN[e.key];
      /* quote: ไม่ auto-close ถ้าตัวถัดไป/ก่อนหน้าเป็นตัวอักษร (กันเกะกะตอนพิมพ์ it's) */
      const isQuote = (e.key === close);
      const nextCh = v[en] || "", prevCh = v[s-1] || "";
      if(s !== en){                       // ห่อ selection: เลือกคำแล้วกด ( → (คำ)
        e.preventDefault();
        const sel = v.slice(s, en);
        ta.value = v.slice(0,s) + e.key + sel + close + v.slice(en);
        ta.selectionStart = s + 1; ta.selectionEnd = s + 1 + sel.length;
        return;
      }
      if(isQuote && (/[A-Za-z0-9ก-๙]/.test(nextCh) || /[A-Za-z0-9ก-๙]/.test(prevCh))) return; // ปล่อยพิมพ์เดี่ยว
      if(!isQuote && /[A-Za-z0-9ก-๙"'`]/.test(nextCh)) return;  // หน้าตัวอักษร ไม่เติมปิด
      e.preventDefault();
      setVal(v.slice(0,s) + e.key + close + v.slice(en), s + 1);
      return;
    }
    /* Backspace ระหว่างคู่ว่าง ( | ) → ลบทั้งคู่ */
    if(e.key === "Backspace" && s === en && s > 0){
      const a = v[s-1], b = v[s];
      if(PAIR_OPEN[a] !== undefined && PAIR_OPEN[a] === b){
        e.preventDefault();
        setVal(v.slice(0, s-1) + v.slice(s+1), s - 1);
        return;
      }
    }
    /* Enter: คงย่อหน้าเดิม + เพิ่มชั้นหลัง { และถ้าอยู่กลาง {} → ดัน } ลงบรรทัดใหม่แบบ VS Code */
    if(e.key === "Enter"){
      const line = v.slice(0, s).split("\n").pop();
      const baseInd = (line.match(/^\s*/) || [""])[0];
      const afterOpen = /[\{\[\(]\s*$/.test(line);
      const beforeClose = /^[\}\]\)]/.test(v.slice(en));
      e.preventDefault();
      if(afterOpen && beforeClose){
        /* {|} → กด Enter ได้ 3 บรรทัด: {, เนื้อใน (เยื้อง), } */
        const inner = baseInd + "  ";
        ta.value = v.slice(0,s) + "\n" + inner + "\n" + baseInd + v.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 1 + inner.length;
      } else {
        const ind = baseInd + (afterOpen ? "  " : "");
        ta.value = v.slice(0,s) + "\n" + ind + v.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 1 + ind.length;
      }
      return;
    }
  });
}

/* trace */
const TRUEW = ["ใช่","จริง","true","t","y","yes","1","เข้า"], FALSEW = ["ไม่","เท็จ","false","f","n","no","0","ไม่เข้า","ข้าม"];
function cellOK(exp, got){
  const g = String(got).trim();
  if(g === "") return false;
  if(exp === "T") return TRUEW.includes(g.toLowerCase());
  if(exp === "F") return FALSEW.includes(g.toLowerCase());
  return g === exp;
}

/* parsons */
function seededShuffle(arr, seed){
  let s = 0; for(const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const a = arr.slice();
  const rnd = ()=>{ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for(let i = a.length - 1; i > 0; i--){ const k = Math.floor(rnd() * (i + 1)); const tmp = a[i]; a[i] = a[k]; a[k] = tmp; }
  if(a.join("\n") === arr.join("\n")) a.push(a.shift());
  return a;
}
function renderParsons(ex, body, j){
  const st = exSt(ex.id);
  if(!parsonsState[ex.id]) parsonsState[ex.id] = {pool: st.done ? [] : seededShuffle(ex.lines, ex.id), ans: st.done ? ex.lines.slice() : []};
  const ps = parsonsState[ex.id];
  const lbl1 = document.createElement("div"); lbl1.className = "pLbl"; lbl1.textContent = "กล่องคำตอบ (เรียงบนลงล่าง — คลิกบรรทัดเพื่อเอาออก):";
  const ansBox = document.createElement("div"); ansBox.className = "pAns";
  const lbl2 = document.createElement("div"); lbl2.className = "pLbl"; lbl2.textContent = "กองบรรทัด (คลิกเพื่อหยิบขึ้นไป):";
  const poolBox = document.createElement("div"); poolBox.className = "pPool";
  body.appendChild(lbl1); body.appendChild(ansBox); body.appendChild(lbl2); body.appendChild(poolBox);
  const row = document.createElement("div"); row.className = "runRow";
  const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "ตรวจลำดับ";
  const rst = document.createElement("button"); rst.className = "btn ghost sm"; rst.textContent = "เริ่มใหม่";
  row.appendChild(btn); row.appendChild(rst); body.appendChild(row);
  const out = document.createElement("div"); body.appendChild(out);
  function draw(){
    ansBox.innerHTML = ps.ans.length ? "" : `<span style="color:var(--dim);font-size:12.5px">— ยังว่าง คลิกบรรทัดจากกองล่างมาเรียงตรงนี้ —</span>`;
    ps.ans.forEach((ln,k)=>{
      const b = document.createElement("button"); b.className = "pLine"; b.textContent = ln;
      b.addEventListener("click", ()=>{ if(st.done) return; ps.ans.splice(k,1); ps.pool.push(ln); draw(); });
      ansBox.appendChild(b);
    });
    poolBox.innerHTML = ps.pool.length ? "" : `<span style="color:var(--dim);font-size:12.5px">— หมดกองแล้ว —</span>`;
    ps.pool.forEach((ln,k)=>{
      const b = document.createElement("button"); b.className = "pLine"; b.textContent = ln;
      b.addEventListener("click", ()=>{ if(st.done) return; ps.pool.splice(k,1); ps.ans.push(ln); draw(); });
      poolBox.appendChild(b);
    });
  }
  draw();
  if(st.done){ btn.disabled = true; rst.disabled = true; out.appendChild(coachBox(ex.why, true)); passUI(ex, body, j); }
  rst.addEventListener("click", ()=>{ if(st.done) return; parsonsState[ex.id] = {pool: seededShuffle(ex.lines, ex.id + st.tries), ans: []}; renderExBody(j); });
  btn.addEventListener("click", ()=>{
    if(st.done) return;
    st.tries++; saveS();
    out.innerHTML = "";
    if(ps.ans.length !== ex.lines.length){
      out.appendChild(coachBox(`ยังหยิบมาไม่ครบ (${ps.ans.length}/${ex.lines.length} บรรทัด) — บรรทัดทุกอันในกองต้องถูกใช้`));
      return;
    }
    let mis = -1;
    for(let k = 0; k < ex.lines.length; k++) if(ps.ans[k] !== ex.lines[k]){ mis = k; break; }
    if(mis < 0){
      solve(ex, j);
      out.appendChild(coachBox(ex.why, true));
      btn.disabled = true; rst.disabled = true;
      passUI(ex, body, j);
    } else {
      out.appendChild(coachBox(`บรรทัดที่ ${mis + 1} ในกล่องคำตอบยังไม่ใช่ตัวที่ควรอยู่ตรงนั้น (บรรทัดก่อนหน้าถูกหมดแล้ว) — <b>คำใบ้:</b> ${ex.nudge}`));
    }
  });
}

      }
    });
    h += "</table>";

    if(pass === run.results.length){

    }
  });
}

const ADMIN_PW = "CHANGE-ME";
function openAdminGate(){
  if(document.getElementById("adminGate")) return;
  const ov = document.createElement("div");
  ov.id = "adminGate";
  ov.style.cssText = "position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(6,9,14,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px";
  ov.innerHTML =
    '<div style="background:linear-gradient(180deg,#1a2130,#141a26);border:2px solid var(--line2);border-radius:14px;box-shadow:0 6px 0 var(--shadow),0 20px 50px rgba(0,0,0,.6);padding:20px 22px;max-width:340px;width:100%;animation:bannerPop .4s cubic-bezier(.2,1,.3,1.35) both">'
    + '<div style="font-family:var(--disp);font-size:16px;color:var(--amber2);letter-spacing:.4px;margin-bottom:4px">🔐 โหมดแอดมิน</div>'
    + '<div style="font-size:12.5px;color:var(--dim);margin-bottom:12px">ใส่รหัสเพื่อปลดล็อกทุกด่าน</div>'
    + '<input id="adminPwIn" type="password" autocomplete="off" class="answerIn" style="font-family:var(--mono)" placeholder="••••••">'
    + '<div style="display:flex;gap:9px;margin-top:14px;justify-content:flex-end">'
    + '<button class="btn ghost sm" id="adminCancel">ยกเลิก</button>'
    + '<button class="btn sm" id="adminOk">ปลดล็อก</button>'
    + '</div></div>';
  document.body.appendChild(ov);
  const inp = document.getElementById("adminPwIn");
  inp.focus();
  const close = ()=>{ try{ ov.remove(); }catch(e){} };
  const submit = ()=>{
    if(inp.value === ADMIN_PW){
      S.free = true; saveS();
      close();
      toast("🔓 ปลดล็อกทุกด่านแล้ว — ลุยได้เลย!");
      route();
    } else { close(); }
  };
  document.getElementById("adminOk").addEventListener("click", submit);
  document.getElementById("adminCancel").addEventListener("click", close);
  inp.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); submit(); } else if(e.key === "Escape"){ close(); } });
  ov.addEventListener("click", e=>{ if(e.target === ov) close(); });
}
let _adTapN = 0, _adTapT = 0;

document.getElementById("homeBtn").addEventListener("click", ()=>{
  const now = Date.now();
  _adTapN = (now - _adTapT < 2500) ? _adTapN + 1 : 1;
  _adTapT = now;
  if(_adTapN >= 7){ _adTapN = 0; openAdminGate(); }
  location.hash = ""; if(!location.hash) route();
});
updateChips();
route();

/* debug/verify hook */
window._dojo = {
  LEVELS, S, runAll, stripTypes, checkFnTest, checkIoTest, injectGuards, blankOK,
  submit: async function(exId, code){
    for(const lv of LEVELS) for(const ex of lv.ex){
      if(ex.id === exId){
        const run = await runAll(ex, code);
        if(run.syntaxErr) return {pass:false, syntaxErr:run.syntaxErr};
        const isIo = ex.mode === "io";
        const oks = run.results.map((r,i)=> isIo ? checkIoTest(ex.tests[i], r) : checkFnTest(ex.tests[i], r));
        return {pass: oks.every(Boolean), oks, results: run.results, coach: coachMsgs(ex, stripTypes(code), run)};
      }
    }
    return {pass:false, err:"exercise not found: " + exId};
  }
};
