<div class="callout"><b>🔑 คำถามยอดฮิต #1: <code>const</code> แต่ <code>push</code> ได้ยังไง?</b><br>
<code>const</code> ล็อก <b>"ป้ายชื่อผูกกับกล่องใบไหน"</b> — ไม่ได้ล็อก <b>"ของข้างในกล่อง"</b><br>
• <code>allid.push("123")</code> = เปิดฝากล่องใบเดิมแล้วหย่อนของเพิ่ม → <b>ทำได้</b><br>
• <code>allid = []</code> = สั่งให้ป้ายชื่อไปผูกกับกล่องใบใหม่ → <b>error: Assignment to constant variable</b><br>
เปรียบเทียบ: const = "ห้ามเปลี่ยนบ้าน" ไม่ใช่ "ห้ามขยับเฟอร์นิเจอร์ในบ้าน"</div>

<div class="callout"><b>ทำไมต้อง 3 อาร์เรย์ (parallel arrays)?</b><br>
เพราะ <b>index เดียวกัน = คนเดียวกัน</b> → <code>allid[2]</code>, <code>allscore[2]</code>, <code>allgrade[2]</code> คือคนที่ 3<br>
<b>กติกาเหล็ก:</b> ต้อง push ครบทั้ง 3 ตัวพร้อมกันเสมอ ถ้า push ไม่ครบแม้ตัวเดียว index จะเลื่อน แล้วข้อมูลคนละคนจะสลับกันทันที (ตอบข้อนี้ได้ = จารย์รู้เลยว่ามึงเข้าใจจริง)<br>
<b>ถ้าถามว่าทำไมไม่ใช้ object?</b> ตอบ: "ใช้ได้และดีกว่า — <code>{id, score, grade}</code> ผูกข้อมูลคนเดียวกันไว้ก้อนเดียว ไม่มีทางเลื่อน แต่ผมเลือก 3 อาร์เรย์คู่ขนานเพราะยังอยู่ในขอบเขตเนื้อหาที่เรียน" (ด่าน 15 มีโค้ดเวอร์ชัน object ให้ดู)</div>

<h3>ท่อน 2 — ลูปหลัก</h3>
<pre class="code">while(true){</pre>
<ul>
<li><code>while</code> = ลูปแบบ <b>ไม่รู้จำนวนรอบล่วงหน้า</b> (ต่างจาก <code>for</code> ที่รู้ว่าวนกี่รอบ) — ที่นี่ไม่มีใครรู้ว่าจะกรอกกี่คน</li>
<li><code>true</code> = เงื่อนไขที่จริงตลอดกาล → <b>ลูปไม่มีวันจบด้วยตัวเอง</b> ต้องพึ่ง <code>break</code> ข้างในอย่างเดียว</li>
<li>ลำดับการทำงานของ while: <b>เช็คเงื่อนไขก่อน → จริงถึงเข้า body</b> (pre-test loop) ต่างจาก <code>do...while</code> ที่ทำ body ก่อนแล้วค่อยเช็ค (จึงทำงานอย่างน้อย 1 รอบเสมอ)</li>
</ul>
<div class="callout"><b>🔑 คำถามยอดฮิต #2: เขียน <code>while(1==1)</code> แทนได้ไหม?</b><br>
<b>ได้ ผลเหมือนกันเป๊ะ</b> — เพราะ <code>1==1</code> ถูกประเมินออกมาเป็นค่า <code>true</code> ก่อน แล้ว while ค่อยเอาไปใช้ ที่ในวงเล็บ while ต้องการคือ "อะไรก็ได้ที่ตีความเป็นจริง/เท็จได้"<br>
• <code>while(true)</code> · <code>while(1==1)</code> · <code>while(1)</code> · <code>while("a")</code> → วนไม่จบเหมือนกันหมด<br>
• <code>while(false)</code> · <code>while(0)</code> · <code>while(1==2)</code> → <b>ไม่เข้าลูปเลยสักรอบ</b> โปรแกรมกระโดดไปท่อนสรุปทันที แล้วพิมพ์ "ไม่มีผลคะแนนใดๆ"<br>
<b>ทำไมเลือกเขียน <code>true</code>?</b> ตอบ: "อ่านแล้วรู้เจตนาทันทีว่าตั้งใจให้วนไม่จบและออกด้วย break ส่วน <code>1==1</code> คนอ่านต้องเสียเวลาคำนวณก่อนว่าได้อะไร"</div>

<pre class="code">const studentID:string = String(prompt("กรอกรหัสนักศึกษา/หรือว่าออก:")).trim()</pre>
<div class="callout"><b>🔑 คำถามยอดฮิต #3: <code>const</code> อยู่ในลูป ค่าเปลี่ยนทุกรอบ ทำไมไม่ error?</b><br>
เพราะทุกครั้งที่วนรอบใหม่ ตัวแปรที่ประกาศใน <code>{ }</code> ของลูปจะถูก <b>สร้างใหม่เป็นคนละกล่อง</b> (block scope — เกิดใหม่ตายใหม่ทุกรอบ) <code>const</code> ห้ามแค่ "ยัดค่าทับกล่องเดิม<b>ภายในรอบเดียวกัน</b>"<br>
พิสูจน์: ถ้าย้ายไปประกาศ <b>นอกลูป</b> ด้วย const แล้วสั่ง <code>studentID = ...</code> ในลูป → <b>error ทันทีรอบที่ 2</b></div>
<ul>
<li><code>prompt()</code> คืนชนิด <code>string | null</code> — <b>null</b> เมื่อผู้ใช้กด Cancel</li>
<li>ห่อด้วย <code>String(...)</code> เพื่อ (1) บังคับให้ชนิดเป็น string แน่ๆ TS จะได้ไม่ฟ้อง (2) กรณี null จะกลายเป็นข้อความ <code>"null"</code> ไม่ใช่ค่า null ที่เรียก <code>.trim()</code> แล้วโปรแกรมพัง</li>
<li><code>.trim()</code> = ตัดช่องว่าง/แท็บ/ขึ้นบรรทัด <b>เฉพาะหัวกับท้าย</b> ไม่ยุ่งตรงกลาง → <code>"  ออก  "</code> → <code>"ออก"</code> แต่ <code>"1234 5678"</code> ยังมีช่องว่างกลางอยู่</li>
<li><b>ต้องอยู่ในลูป</b> ถ้าย้ายออกไปนอกลูป โปรแกรมจะถามครั้งเดียวแล้ววนใช้ค่าเดิมไม่รู้จบ</li>
</ul>

<pre class="code">if(studentID === "ออก"){
    break
}</pre>
<ul>
<li><code>===</code> เทียบ <b>ทั้งค่าและชนิด</b> (strict) · <code>==</code> แปลงชนิดให้ก่อนแล้วค่อยเทียบ (loose) → <code>"5" == 5</code> เป็นจริง แต่ <code>"5" === 5</code> เป็นเท็จ · <b>ในข้อสอบใช้ <code>===</code> เสมอ</b></li>
<li><code>break</code> = <b>ออกจากลูปทันที</b> กระโดดไปทำบรรทัดแรกหลังปีกกาปิดของ while</li>
<li><b>🔑 ทำไมบล็อกนี้ต้องอยู่ก่อนด่านตรวจทั้ง 3?</b> เพราะคำว่า "ออก" ยาว 3 ตัวอักษร ถ้าเอาไปเจอ <code>length !== 12</code> ก่อน จะโดนตีกลับว่า "ต้องมี 12 หลัก" → <b>ออกจากโปรแกรมไม่ได้ตลอดชาติ</b> (จารย์ชอบสลับลำดับให้ดูแล้วถามว่าเกิดอะไรขึ้น)</li>
</ul>

<pre class="code">if(studentID.length !== 12){ ... continue }</pre>
<ul>
<li><code>.length</code> ของ string = จำนวนตัวอักษร (ของ array = จำนวนช่อง)</li>
<li><code>continue</code> = <b>ข้ามโค้ดที่เหลือในรอบนี้ กระโดดขึ้นไปเช็คเงื่อนไข while ใหม่</b> — ไม่ใช่ออกจากลูป</li>
</ul>
<table>
<tr><th></th><th>break</th><th>continue</th></tr>
<tr><td>ทำอะไร</td><td>ออกจากลูปเลย</td><td>ขึ้นรอบใหม่</td></tr>
<tr><td>โค้ดที่เหลือในรอบนั้น</td><td>ไม่ทำ</td><td>ไม่ทำ</td></tr>
<tr><td>รอบต่อไป</td><td>ไม่มีแล้ว</td><td>มี (กลับไปเช็คเงื่อนไขก่อน)</td></tr>
<tr><td>ในโปรแกรมมึง</td><td>ใช้ตอนพิมพ์ "ออก"</td><td>ใช้ตอนกรอกผิด → ให้กรอกใหม่</td></tr>
</table>

<pre class="code">if(isNaN(Number(studentID)) || studentID.includes(".") || studentID.includes(" ")){ ... continue }</pre>
<ul>
<li><code>Number(x)</code> แปลงข้อความเป็นตัวเลข ถ้าแปลงไม่ได้จะได้ <code>NaN</code> (Not a Number)</li>
<li><code>isNaN(y)</code> ถามว่า "ค่านี้คือ NaN ใช่ไหม" คืน true/false</li>
<li><code>||</code> = <b>หรือ</b> จริงข้อเดียวก็เข้า และเป็น <b>short-circuit</b> คือถ้าข้อแรกจริงแล้ว มันไม่เสียเวลาเช็คข้อที่เหลือเลย</li>
<li><b>ทำไมต้องดัก <code>.</code> เองทั้งที่มี isNaN แล้ว?</b> เพราะ <code>Number("1234567890.1")</code> = ตัวเลขจริง ไม่ใช่ NaN → <b>รหัสมีจุดทศนิยมจะหลุดผ่าน</b> ถ้าไม่ดักเอง</li>
<li><b>ทำไมดัก <code>" "</code> ทั้งที่ trim ไปแล้ว?</b> trim ตัดแค่หัวท้าย ช่องว่างที่แทรก<b>กลาง</b> เช่น <code>"1234 5678901"</code> ยังอยู่ (เกร็ดลึก: กรณีนี้ Number ก็ให้ NaN อยู่แล้ว การดักซ้ำจึงเป็นการ <b>เขียนให้เจตนาชัด</b> คนอ่านเห็นแล้วรู้ทันทีว่ากันอะไร)</li>
</ul>
<div class="callout red"><b>รูรั่วที่จารย์เก่งๆ ชอบจิ้ม</b> — รหัสพวกนี้ผ่านด่านตรวจได้ทั้งที่ไม่ใช่ตัวเลขล้วน:<br>
<code>+12345678901</code> (12 ตัว) → Number ได้เลข ไม่ NaN ไม่มีจุด ไม่มีช่องว่าง → <b>ผ่าน!</b> · เช่นเดียวกับ <code>-12345678901</code> และ <code>0x1234567890</code><br>
<b>ตอบยังไง:</b> "รู้ครับ วิธีอุดคือเช็คว่าเป็นเลข 0-9 ทุกตัวจริงๆ" แล้วเขียนให้ดู 1 ใน 2 แบบ:
<pre class="code">// แบบ 1 — regular expression (สั้นสุด)
if(!/^[0-9]{12}$/.test(studentID)){ ... continue }

// แบบ 2 — ลูปเช็คทีละตัวอักษร (ไม่ต้องใช้ของนอกบทเรียน)
let isAllDigit:boolean = true
for(let i = 0; i &lt; studentID.length; i++){
    if(studentID[i] &lt; "0" || studentID[i] &gt; "9"){ isAllDigit = false; break }
}
if(!isAllDigit){ ... continue }</pre></div>

<pre class="code">if(allid.includes(studentID)){ ... continue }</pre>
<ul>
<li><code>.includes()</code> ของอาร์เรย์ = "มีค่านี้อยู่ในอาร์เรย์ไหม" คืน true/false</li>
<li>ข้างในมันคือ <b>ลูปวิ่งเทียบทีละช่อง (linear search)</b> — ถ้าจารย์สั่งห้ามใช้ ให้เขียนเอง:</li>
</ul>
<pre class="code">let isDuplicateID:boolean = false
for(let i = 0; i &lt; allid.length; i++){
    if(allid[i] === studentID){ isDuplicateID = true; break }
}
if(isDuplicateID){ ... continue }</pre>
<p class="dim">เช็คซ้ำต้องอยู่ <b>ท้ายสุดของด่านตรวจ</b> — ตรวจของถูกรูปแบบก่อน ค่อยไปไล่หาในคลัง (ถูกทั้งตรรกะและประสิทธิภาพ)</p>

<pre class="code">const score:number = Number(prompt(\`คะแนนรวมของนักศึกษารหัส \${studentID} :\`))</pre>
<ul>
<li>เครื่องหมาย <b>backtick</b> <code>\` \`</code> = template literal · <code>\${ตัวแปร}</code> = แทรกค่าลงในข้อความ</li>
<li>เขียนแบบต่อสตริงก็ได้ผลเดียวกัน: <code>"คะแนนรวมของนักศึกษารหัส " + studentID + " :"</code></li>
<li><code>Number(...)</code> จำเป็น เพราะ prompt คืน string — ถ้าลืมแปลงแล้วเอาไปบวก <code>"80" + 1</code> จะได้ <code>"801"</code> ไม่ใช่ 81</li>
<li>พิมพ์ <code>abc</code> → <code>NaN</code> · กด Cancel → <code>Number(null)</code> = <b>0</b> → ได้เกรด <b>F</b> (ไม่ error!)</li>
</ul>

<h3>ท่อนตัดเกรด (จุดที่ต้องอธิบายให้แม่นที่สุด)</h3>
<pre class="code">if(score >= 80 && score &lt;= 100){ ... "A" }
else if(score >= 70){ ... "B" }
else if(score >= 60){ ... "C" }
else if(score >= 50){ ... "D" }
else if(score >= 0){  ... "F" }
else{ "ข้อมูลไม่ถูกต้อง" }</pre>
<ul>
<li><code>&amp;&amp;</code> = <b>และ</b> ต้องจริงทั้งสองข้าง</li>
<li><b>ทำไมชั้นล่างไม่ต้องเขียน <code>score &lt; 80</code>?</b> เพราะจะมาถึงบรรทัด <code>else if</code> ได้ ต้องแปลว่าเงื่อนไขข้างบน<b>เป็นเท็จ</b>ไปแล้ว = รู้อยู่แล้วว่าน้อยกว่า 80 → มันคือการ <b>กรองทีละชั้นจากบนลงล่าง</b></li>
<li><b>ลำดับสำคัญมาก:</b> ถ้าเอา <code>score >= 0</code> ขึ้นไปไว้บนสุด <b>ทุกคนจะได้ F หมด</b> เพราะ else-if จะหยุดที่เงื่อนไขแรกที่เป็นจริง</li>
<li><b>NaN ตกที่ไหน?</b> การเปรียบเทียบใดๆ กับ NaN เป็น<b>เท็จหมด</b> (<code>NaN >= 0</code> ก็เท็จ) → ไหลลงมาถึง <code>else</code> → พิมพ์ "ข้อมูลไม่ถูกต้อง" ✅ อันนี้โค้ดมึงทำถูกแล้ว</li>
</ul>

<div class="callout red"><b>🔴 บั๊กเกรดเกิน 100 — จุดตายอันดับ 1 ของโค้ดมึง</b><br>
ลอง <code>score = 105</code> เดินตามโค้ดจริง:<br>
1. <code>105 >= 80</code> จริง <b>แต่</b> <code>105 &lt;= 100</code> เท็จ → <code>&amp;&amp;</code> ทั้งก้อนเป็น<b>เท็จ</b> → ไม่เข้า A<br>
2. <code>else if(score >= 70)</code> → <code>105 >= 70</code> <b>จริง!</b> → <b>ได้เกรด B</b> 😱<br>
แต่คำชี้แจงที่มึงเขียนเองบอกว่า "นอกช่วง (ติดลบ/เกิน 100) = ข้อมูลไม่ถูกต้อง" → <b>โค้ดกับสเปกไม่ตรงกัน</b><br>
สรุปสั้นๆ: <code>else</code> ตัวสุดท้ายดักได้แค่ <b>ติดลบกับ NaN</b> เท่านั้น ดักเกิน 100 ไม่ได้เลย<br><br>
<b>ถ้าจารย์จับได้ ให้ตอบแบบนี้:</b> "ครับ ตรงนี้เป็นบั๊กจริง เพราะ <code>&amp;&amp; score&lt;=100</code> อยู่แค่ชั้นแรก พอ 105 ตกชั้นแรกมันเลยไหลลงไปติด <code>&gt;=70</code> วิธีแก้ที่ถูกคือ <b>ตรวจความถูกต้องของข้อมูลให้จบก่อน แล้วค่อยตัดเกรด</b>" แล้วเขียนให้ดู:
<pre class="code">// ✅ แก้: ด่านตรวจข้อมูลอยู่แยกจากด่านตัดเกรด
if(isNaN(score) || score &lt; 0 || score > 100){
    console.log("[!] ข้อมูลไม่ถูกต้อง")
    continue
}
if(score >= 80){ grade = "A" }
else if(score >= 70){ grade = "B" }
else if(score >= 60){ grade = "C" }
else if(score >= 50){ grade = "D" }
else{ grade = "F" }</pre>
สังเกตว่าพอกรองนอกช่วงทิ้งไปก่อน ชั้น A ก็<b>ไม่ต้องมี <code>&amp;&amp; score&lt;=100</code></b> อีกแล้ว — โค้ดสั้นลงและถูกขึ้นพร้อมกัน</div>

<h3>ท่อน 3 — สรุปผล</h3>
<pre class="code">if(allid.length === 0){
    console.log("        ไม่มีผลคะแนนใดๆ")
}else{
    for(let i = 0; i &lt; allid.length; i++){
        console.log(\`\${i + 1}. \${allid[i]} - คะแนน \${allscore[i]} เกรด \${allgrade[i]}\`)
    }
}</pre>
<ul>
<li><code>allid.length === 0</code> = คลังว่างเปล่า (ยังไม่มีใครกรอกผ่านเลย)</li>
<li><code>let i</code> ต้องเป็น <b>let</b> เพราะ <code>i++</code> คือการยัดค่าใหม่ทับ — ใช้ <code>const i</code> จะ error ทันที</li>
<li><code>i &lt; allid.length</code> ใช้ <b>&lt;</b> ไม่ใช่ <b>&lt;=</b> เพราะ index เริ่มที่ 0 ช่องสุดท้ายคือ <code>length-1</code> → ถ้าใช้ <code>&lt;=</code> จะเกินไป 1 ช่อง ได้ <code>undefined</code> ต่อท้าย</li>
<li><code>\${i + 1}</code> เพราะ index เริ่ม 0 แต่คนอ่านนับ 1</li>
<li><b>ลูปเดียวอ่าน 3 อาร์เรย์</b> ด้วย index ตัวเดียวกัน = ดึงข้อมูลของคนเดียวกันออกมาครบ</li>
</ul>

{ id:"L14E9", type:"fix", title:"⭐ ซ่อมบั๊กเกรดเกิน 100 (ของจริงจากโค้ดมึง)", mode:"fn", fnName:"grade",

  starter:`function grade(score: number): string {

    return "D";
  } else if (score >= 0) {
    return "F";
  } else {
    return "ข้อมูลไม่ถูกต้อง";
  }
}`,
  tests:[
    {args:[105], expect:"ข้อมูลไม่ถูกต้อง"},
    {args:[-1], expect:"ข้อมูลไม่ถูกต้อง"},
    {args:[100], expect:"A"},
    {args:[85], expect:"A"},
    {args:[70], expect:"B"},
    {args:[69], expect:"C"},
    {args:[50], expect:"D"},
    {args:[0], expect:"F"},
  ],
  hints:[
    `ปัญหาคือ 105 "ตกชั้น A แล้วไปติดชั้น B" — แปลว่าโครง else-if แบบไล่ลงอย่างเดียวดักค่าที่ล้นด้านบนไม่ได้ ต้องจัดการมันก่อนจะเข้าโซ่`,
    `ท่ามาตรฐาน: ตรวจความถูกต้องของข้อมูลให้จบก่อน แล้วค่อยตัดเกรด → บรรทัดแรกสุดดัก score < 0 หรือ score > 100 ทิ้งไปเลย`,
    `โครง: if (score ____ 0 || score ____ 100) return "ข้อมูลไม่ถูกต้อง"; แล้วค่อย if (score >= 80) return "A"; ... (ชั้น A ไม่ต้องมี && อีกแล้ว)`,
  ],
  why:`บทเรียนที่แพงที่สุดของข้อนี้: <b>อย่าเอาการตรวจข้อมูล (validation) ไปปนกับการตัดสินใจ (logic)</b> — พอแยกออกจากกัน โค้ดสั้นลง อ่านง่ายขึ้น และบั๊กหายไปเอง · ถ้าจารย์ถามว่ารู้ตัวไหมว่าโค้ดมีบั๊กนี้ ให้ตอบว่ารู้ พร้อมเขียนวิธีแก้ให้ดู — <b>ยอมรับแล้วแก้เป็น ได้คะแนนมากกว่าเถียง</b>` },

{ id:"L14E10", type:"mcq", title:"พิมพ์ abc ในช่องคะแนน",
  brief:`<p>ผู้ใช้พิมพ์ <code>abc</code> ในช่องคะแนน → <code>const score = Number("abc")</code> ได้ <code>NaN</code><br>แล้วทำไมโปรแกรมถึงพิมพ์ "ข้อมูลไม่ถูกต้อง" ออกมาได้ถูกต้อง?</p>`,
  choices:[
    `เพราะ NaN ถูกนับเป็น 0 แล้วตกไปที่ else`,
    `เพราะการเปรียบเทียบทุกแบบกับ NaN ให้ผลเป็นเท็จหมด จึงไหลผ่านทุกชั้นไปถึง else`,
    `เพราะ TypeScript ดักชนิดข้อมูลให้ตั้งแต่แรก`,
    `เพราะ isNaN ถูกเรียกอัตโนมัติในทุก if`], ok:1,
  nudge:"ลองถามตัวเองทีละข้อ: NaN >= 80 จริงไหม? NaN >= 0 จริงไหม? แล้วถ้าทุกข้อเป็นเท็จหมด โปรแกรมจะไปจบที่ไหน",
  why:`<b>NaN เทียบกับอะไรก็เป็นเท็จ</b> รวมถึง <code>NaN >= 0</code> และแม้แต่ <code>NaN === NaN</code> ก็ยังเท็จ (นี่คือเหตุผลที่ต้องมีฟังก์ชัน <code>isNaN()</code> แยกต่างหาก) → ทุกชั้นเท็จหมด ไหลลง <code>else</code> พอดี<br><b>เกร็ดที่ทำให้ดูเก่ง:</b> "ตรงนี้โค้ดทำงานถูกโดยบังเอิญจากธรรมชาติของ NaN ถ้าจะให้ชัดเจนควรเขียน <code>isNaN(score)</code> ดักตรงๆ ตั้งแต่ต้น"` },

{ id:"L14E11", type:"predict", title:"กด Cancel ที่ช่องรหัส",
  code:`const raw = null
const studentID = String(raw).trim()
console.log(studentID)
console.log(studentID.length)
console.log(studentID === "ออก")`,
  answer:"null\n4\nfalse",
  nudge:"prompt() ตอนกด Cancel คืน null — พอเอาไปห่อ String() มันกลายเป็นข้อความว่าอะไร แล้วข้อความนั้นยาวกี่ตัวอักษร? (ตอบ 3 บรรทัด)",
  why:`<code>String(null)</code> = ข้อความ <code>"null"</code> (4 ตัวอักษร) ไม่ใช่ค่าว่าง → เข้าด่าน <code>length !== 12</code> → โปรแกรมด่าว่ารหัสต้องมี 12 หลัก แล้ววนถามใหม่ <b>ไม่พัง</b><br><b>นี่คือเหตุผลที่ต้องห่อ <code>String()</code></b> — ถ้าเขียน <code>prompt().trim()</code> เฉยๆ แล้วผู้ใช้กด Cancel จะได้ <code>null.trim()</code> = <b>โปรแกรมพังทันที</b> (Cannot read properties of null)` },

{ id:"L14E12", type:"mcq", title:".trim() ตัดตรงไหนบ้าง",
  brief:`<p>ผู้ใช้พิมพ์ <code>"  1234 5678901  "</code> (มีช่องว่างหน้า-หลัง และมีช่องว่างแทรกกลาง 1 ตัว)<br>หลังผ่าน <code>.trim()</code> แล้วผลเป็นอะไร?</p>`,
  choices:[
    `"12345678901" — ตัดช่องว่างทั้งหมด`,
    `"1234 5678901" — ตัดเฉพาะหัวกับท้าย ช่องว่างกลางยังอยู่`,
    `"  1234 5678901  " — ไม่เปลี่ยนอะไร`,
    `error เพราะมีช่องว่างในข้อความ`], ok:1,
  nudge:"ชื่อมันบอกอยู่ว่า trim = เล็มขอบ — เล็มขอบเสื้อไม่ได้แปลว่าตัดรูตรงกลางเสื้อ",
  why:`<code>.trim()</code> ตัด<b>เฉพาะหัวและท้าย</b> ช่องว่างที่แทรกกลางยังอยู่ครบ → นี่แหละเหตุผลที่โค้ดมึงยังต้องมี <code>studentID.includes(" ")</code> ต่ออีกชั้น<br><b>ประโยชน์จริงของ trim ในโปรแกรมมึง:</b> ผู้ใช้เผลอพิมพ์ <code>"ออก "</code> ติดช่องว่าง ถ้าไม่ trim จะเทียบกับ <code>"ออก"</code> ไม่ตรง → <b>ออกจากโปรแกรมไม่ได้</b>` },

{ id:"L14E13", type:"mcq", title:"รูรั่วของด่านตรวจตัวเลข",
  brief:`<p>ด่านตรวจของมึงคือ<br><code>isNaN(Number(id)) || id.includes(".") || id.includes(" ")</code><br>รหัสข้อไหน <b>หลุดผ่านด่านนี้ไปได้</b> ทั้งที่ไม่ใช่ตัวเลขล้วน 12 หลัก?</p>`,
  choices:[
    `"69162110080a" (มีตัวอักษร a)`,
    `"6916211008.9" (มีจุด)`,
    `"+12345678901" (มีเครื่องหมายบวกนำหน้า)`,
    `"6916 1100809" (มีช่องว่างกลาง)`], ok:2,
  nudge:"ลองไล่ทีละข้อว่า Number(...) ของมันได้ NaN ไหม แล้วมีจุดหรือช่องว่างไหม — ข้อที่ผ่านทุกด่านคือข้อไหน",
  why:`<code>Number("+12345678901")</code> = <b>12345678901</b> เป็นตัวเลขจริง ไม่ใช่ NaN · ไม่มีจุด · ไม่มีช่องว่าง · ยาว 12 ตัวพอดี → <b>ผ่านหมดทุกด่าน</b> (พวก <code>-12345678901</code> และ <code>0x1234567890</code> ก็เหมือนกัน)<br><b>วิธีอุด</b> เขียนให้จารย์ดูได้เลย: <code>if(!/^[0-9]{12}$/.test(studentID))</code> หรือถ้าไม่อยากใช้ regex ก็วนเช็คทีละตัวอักษรว่าอยู่ระหว่าง "0" ถึง "9"<br><b>การรู้รูรั่วของโค้ดตัวเอง = คะแนนพรีเซนต์</b> ไม่ใช่จุดอ่อน` },

{ id:"L14E14", type:"trace", title:"ตารางไล่ค่า: อาร์เรย์คู่ขนาน",
  brief:`<p>ผู้ใช้กรอกตามลำดับนี้: <code>111111111111</code> → <code>85</code> → <code>222</code> (รหัสสั้น) → <code>333333333333</code> → <code>65</code> → <code>ออก</code><br>เติมตารางว่าหลังจบแต่ละรอบ อาร์เรย์มีอะไรอยู่บ้าง (ช่องที่ยังว่างให้ตอบ <code>ว่าง</code>)</p>`,
  code:`while(true){
    const studentID = String(prompt()).trim()
    if(studentID === "ออก") break
    if(studentID.length !== 12){ console.log("[!] ต้องมี 12 หลัก"); continue }
    const score = Number(prompt())
    if(score >= 80){ allid.push(studentID); allgrade.push("A"); continue }
    else if(score >= 60){ allid.push(studentID); allgrade.push("C"); continue }
}`,
  cols:["รอบที่","รหัสที่รับ","ถามคะแนนไหม?","จำนวนคนใน allid หลังจบรอบ"],
  rows:[
    ["1","111111111111","T","1"],
    ["2","222","F","1"],
    ["3","333333333333","T","2"],
    ["4","ออก","F","2"],
  ],
  final:{label:"สุดท้าย allgrade[1] คือเกรดอะไร (ตอบตัวอักษรเดียว):", answer:"C"},
  nudge:"รอบที่รหัสไม่ครบ 12 หลักจะเจอ continue ก่อนถึงบรรทัดรับคะแนน — แปลว่ารอบนั้นโปรแกรมไม่ถามคะแนนเลย และไม่มีใครถูก push · ช่องกลางตอบ ใช่/ไม่ ก็ได้ · ช่องท้ายสุด: index 1 คือคนที่เท่าไหร่?",
  why:`จุดสำคัญที่ต้องเห็นคือ <b><code>continue</code> ตัดจบรอบตั้งแต่ด่านตรวจ</b> — รอบที่ 2 ไม่มีการถามคะแนนด้วยซ้ำ · และ <b>allid กับ allgrade โตขึ้นพร้อมกันเสมอ</b> จำนวนช่องเท่ากันตลอด นี่คือสิ่งที่ทำให้ index เดียวกันหมายถึงคนเดียวกันได้จริง` },

{ id:"L14E15", type:"predict", title:"ลูปสรุปผล ถ้าเผลอใช้ <=",
  code:`const allid = ["111111111111","222222222222"]
for(let i = 0; i <= allid.length; i++){
    console.log(allid[i])
}`,
  answer:"111111111111\n222222222222\nundefined",
  nudge:"allid.length = 2 แต่ช่องมีแค่ index 0 กับ 1 — ถ้าเงื่อนไขยอมให้ i เดินไปถึง 2 ด้วย มันจะไปหยิบอะไรมา? (ตอบ 3 บรรทัด)",
  why:`อาร์เรย์ 2 ช่อง มี index <b>0 กับ 1</b> เท่านั้น ช่อง index 2 ไม่มีอยู่จริง → ได้ <code>undefined</code><br>นี่คือ <b>off-by-one</b> คลาสสิก — สูตรจำ: <code>i &lt; array.length</code> เสมอ (ใช้ <code>&lt;=</code> ต่อเมื่อเขียน <code>length - 1</code>)<br>ในโค้ดมึงเขียน <code>&lt;</code> มาถูกแล้ว ถ้าจารย์ถามว่าทำไมไม่ใช้ <code>&lt;=</code> ตอบข้อนี้ได้เลย` },

{ id:"L14E16", type:"parsons", title:"เรียงลำดับด่านตรวจให้ถูก",
  brief:`<p>เรียงบรรทัดให้เป็นลูปหลักที่ทำงานถูกต้อง (คลิกจากกองล่างขึ้นไปเรียง) — <b>ลำดับของด่านตรวจสำคัญมาก</b> คิดให้ดีว่าอะไรต้องมาก่อน</p>`,
  lines:[
`while(true){`,
`  const studentID = String(prompt()).trim()`,
`  if(studentID === "ออก"){ break }`,
`  if(studentID.length !== 12){ console.log("ต้องมี 12 หลัก"); continue }`,
`  if(allid.includes(studentID)){ console.log("รหัสซ้ำ"); continue }`,
`  const score = Number(prompt())`,
`  allid.push(studentID)`,
`}`,
  ],
  nudge:"จังหวะคือ: เปิดลูป → รับค่า → เช็คคำสั่งออกก่อนเพื่อน → ตรวจรูปแบบ → ตรวจซ้ำในคลัง → รับคะแนน → เก็บ → ปิดลูป",
  why:`เหตุผลของแต่ละลำดับ (ต้องพูดได้ทุกข้อ):<br>
1. <b>รับค่าต้องอยู่ในลูป</b> — อยู่นอกลูป = ถามครั้งเดียววนค่าเดิมชั่วนิรันดร์<br>
2. <b>"ออก" ต้องเช็คก่อนตรวจรูปแบบ</b> — เพราะ "ออก" ยาว 3 ตัว ถ้าตรวจ 12 หลักก่อนจะออกไม่ได้<br>
3. <b>ตรวจรูปแบบก่อนตรวจซ้ำ</b> — ของที่รูปแบบยังผิด ไม่มีประโยชน์จะเอาไปไล่หาในคลัง<br>
4. <b>รับคะแนนหลังผ่านทุกด่าน</b> — ไม่งั้นเสียเวลาถามคะแนนของรหัสที่ใช้ไม่ได้` },

{ id:"L14E17", type:"write", title:"⭐ เขียนโปรแกรมตัวเองฉบับย่อ (ทั้งลูป)", mode:"io",
  brief:`<p>เขียนโปรแกรมย่อส่วนของโปรแกรมมึงเอง ให้ทำงานตามนี้เป๊ะๆ:</p>
<ol>

<li>ถ้ารหัสยาว 12 → รับคะแนนต่อ แล้วพิมพ์ <code>รหัส เว้นวรรค เกรด</code> เช่น <code>691621100809 A</code><br>เกณฑ์: 80+=A · 70-79=B · 60-69=C · 50-59=D · ต่ำกว่า 50=F</li>
<li>ออกจากลูปแล้วพิมพ์บรรทัดสุดท้าย <code>รวม N คน</code> (N = จำนวนคนที่บันทึกได้)</li>
</ol>
<p class="dim">ข้อนี้คือหัวใจของข้อสอบมึงทั้งข้อ — เขียนให้ผ่านได้ = เขียนใส่กระดาษพรุ่งนี้ได้</p>`,
  starter:`const allid: string[] = []

// เขียนลูปหลักตรงนี้

`,
  tests:[
    {inputs:["691621100809","85","ออก"], expect:["691621100809 A","รวม 1 คน"]},
    {inputs:["123","ออก"], expect:["รหัสผิด","รวม 0 คน"]},
    {inputs:["111111111111","70","222222222222","49","ออก"], expect:["111111111111 B","222222222222 F","รวม 2 คน"]},
    {inputs:["ออก"], expect:["รวม 0 คน"]},
    {inputs:["12345","333333333333","65","ออก"], expect:["รหัสผิด","333333333333 C","รวม 1 คน"]},
  ],
  hints:[
    `จังหวะ 6 ขั้นเหมือนโค้ดจริงของมึง: while(true) → รับรหัส → เช็ค "ออก" break → เช็ค length continue → รับคะแนน → ตัดเกรดแล้วพิมพ์ + push`,
    `ตัดเกรดแล้วเก็บไว้ในตัวแปรก่อน (let studentGrade = "") จะพิมพ์ง่ายกว่าเขียน console.log ซ้ำในทุกกิ่ง — และอย่าลืม push เข้า allid เพื่อจะได้นับจำนวนคนตอนท้าย`,
    `โครง: while(true){ const id=String(prompt()).trim(); if(id==="ออก") break; if(id.length!==12){ console.log("รหัสผิด"); continue } const sc=Number(prompt()); let g=""; if(sc>=80){g="A"} else if(____){...} ...; console.log(id + " " + g); allid.push(id) } console.log("รวม " + ____ + " คน")`,
  ],
  why:`นี่คือโครงเดียวกับข้อสอบมึงทุกกระเบียด แค่ถอดการตรวจตัวเลข/ตรวจซ้ำออก · <b>ถ้าเขียนข้อนี้ได้ตั้งแต่บรรทัดแรกถึงบรรทัดสุดท้ายโดยไม่เปิดอะไรเลย = พร้อมขึ้นกระดานแล้ว</b> ลองเขียนใส่กระดาษจริงอีกรอบก่อนนอน` },

]},

/* ================= L15 : ตั้งชื่อ + const/let + เขียนใหม่คนละอัลกอริทึม ================= */
{
id:"L15", icon:"🏷️", always:true, title:"ตั้งชื่อตัวแปร · const/let · เขียนใหม่คนละอัลกอริทึม", sub:"ตอบให้ได้ว่าทำไมชื่อนี้ ทำไม const ไม่ let + เขียนโปรแกรมเดิมได้อีก 6 แบบ",
teach: `
<div class="callout"><b>จารย์ประเภทนี้ชอบถาม 2 คำถามนี้ที่สุด</b><br>
1. "ตรงนี้ทำไมใช้ <code>const</code> ไม่ใช้ <code>let</code>" → มีคำตอบสูตรสำเร็จอยู่ในบทนี้<br>
2. "ตัวแปรชื่อนี้เก็บอะไร ทำไมตั้งชื่อแบบนี้" → ตอบไม่ได้ = โดนหาว่าลอกมา</div>

<h3>กฎเหล็ก const/let — ตัดสินใน 3 วินาที</h3>
<pre class="code">ถามข้อเดียว: "หลังยัดค่าครั้งแรกแล้ว มีบรรทัดไหนสั่งยัดค่าใหม่ทับอีกไหม?"
  มี   → let
  ไม่มี → const   ← ค่าเริ่มต้น ใช้อันนี้ก่อนเสมอ</pre>

<h3>🔁 เขียนใหม่คนละอัลกอริทึม — โปรแกรมตัดเกรด 6 แบบ</h3>
<p>ทุกแบบ <b>รับค่าเหมือนเดิม พิมพ์ผลเหมือนเดิม</b> ต่างกันที่วิธีคิดข้างใน — จารย์ชอบสั่งว่า "เขียนใหม่อีกแบบสิ"</p>

<h3>แบบ 1 — เก็บเกรดใส่ตัวแปร แล้ว push ครั้งเดียว (แนะนำที่สุด)</h3>
<pre class="code">const inputStudentScore: number = Number(prompt("คะแนนรวม:"))

if(isNaN(inputStudentScore) || inputStudentScore &lt; 0 || inputStudentScore > 100){
    console.log("[!] ข้อมูลไม่ถูกต้อง")
    continue
}

let studentGrade: string = ""
if(inputStudentScore >= 80){ studentGrade = "A" }
else if(inputStudentScore >= 70){ studentGrade = "B" }
else if(inputStudentScore >= 60){ studentGrade = "C" }
else if(inputStudentScore >= 50){ studentGrade = "D" }
else{ studentGrade = "F" }

allStudentIDs.push(inputStudentID)
allStudentScores.push(inputStudentScore)
allStudentGrades.push(studentGrade)
console.log(\`นักศึกษารหัส \${inputStudentID} | คะแนน \${inputStudentScore} | เกรด \${studentGrade}\`)</pre>
<p><b>ข้อดีที่ต้องพูด:</b> โค้ด push กับ console.log เขียนที่เดียว (ของเดิมเขียนซ้ำ 5 รอบ) → แก้ข้อความทีเดียวจบ ไม่มีทางแก้ตกหล่น และ<b>บั๊กเกิน 100 หายไปเอง</b><br>
<b>ทำไม <code>studentGrade</code> ต้องเป็น let?</b> เพราะประกาศเปล่าไว้ก่อน แล้วยัดค่าทีหลังในกิ่ง if</p>

<h3>แบบ 2 — แยกเป็นฟังก์ชัน (โครงที่มืออาชีพใช้)</h3>
<pre class="code">function isValidStudentID(inputID: string, savedIDs: string[]): boolean {
    if(inputID.length !== 12) return false
    if(isNaN(Number(inputID)) || inputID.includes(".") || inputID.includes(" ")) return false
    if(savedIDs.includes(inputID)) return false
    return true
}

function gradeOf(score: number): string {
    if(score &lt; 0 || score > 100 || isNaN(score)) return "ข้อมูลไม่ถูกต้อง"
    if(score >= 80) return "A"
    if(score >= 70) return "B"
    if(score >= 60) return "C"
    if(score >= 50) return "D"
    return "F"
}</pre>
<p><b>สังเกต:</b> ใน function ใช้ <code>return</code> แทน <code>else</code> ได้เลย เพราะ return = ออกจากฟังก์ชันทันที บรรทัดล่างไม่มีทางทำงานถ้าเงื่อนไขบนจริง (เรียกว่า <b>early return</b> — โค้ดแบนราบ อ่านง่ายกว่า else ซ้อนกัน)<br>
<b>ข้อดีที่ต้องพูด:</b> ตรรกะตัดเกรดถูกแยกออกมาทดสอบเดี่ยวๆ ได้ และเอาไปใช้ซ้ำที่อื่นได้</p>

<h3>แบบ 3 — เก็บเป็นอาร์เรย์ของ object (แทน 3 อาร์เรย์คู่ขนาน)</h3>
<pre class="code">const allStudents: {id: string; score: number; grade: string}[] = []

allStudents.push({ id: inputStudentID, score: inputStudentScore, grade: studentGrade })

// ตอนสรุป
for(let i = 0; i &lt; allStudents.length; i++){
    console.log(\`\${i+1}. \${allStudents[i].id} - คะแนน \${allStudents[i].score} เกรด \${allStudents[i].grade}\`)
}</pre>
<p><b>ข้อดี:</b> ข้อมูลคนเดียวกันอยู่ก้อนเดียวกัน <b>ไม่มีทางเลื่อน index จนข้อมูลสลับคน</b> · <b>ข้อเสีย:</b> ใช้ความรู้เรื่อง object ที่อาจยังไม่ได้เรียน</p>

<h3>แบบ 4 — ตารางเกณฑ์ (table-driven) ไม่มี if ตัดเกรดเลย</h3>
<pre class="code">const gradeMinScores: number[] = [80, 70, 60, 50, 0]
const gradeNames: string[] = ["A", "B", "C", "D", "F"]

let studentGrade: string = "ข้อมูลไม่ถูกต้อง"
if(inputStudentScore >= 0 && inputStudentScore &lt;= 100){
    for(let i = 0; i &lt; gradeMinScores.length; i++){
        if(inputStudentScore >= gradeMinScores[i]){
            studentGrade = gradeNames[i]
            break
        }
    }
}</pre>
<p><b>หัวใจ:</b> ตารางต้อง<b>เรียงจากคะแนนมากไปน้อย</b> แล้วเจอตัวแรกที่ผ่านให้ <code>break</code> ทันที (หลักการเดียวกับ else-if เป๊ะ แค่ย้ายเกณฑ์ออกมาเป็นข้อมูล)<br>
<b>ข้อดี:</b> อยากเพิ่มเกรด B+ แค่เติมเลขในอาร์เรย์ ไม่ต้องแก้ตรรกะ</p>

<h3>แบบ 5 — switch โดยหารสิบ</h3>
<pre class="code">let studentGrade: string = ""
switch(Math.floor(inputStudentScore / 10)){
    case 10:
    case 9:
    case 8:  studentGrade = "A"; break
    case 7:  studentGrade = "B"; break
    case 6:  studentGrade = "C"; break
    case 5:  studentGrade = "D"; break
    default: studentGrade = "F"
}</pre>
<p><code>Math.floor(85/10)</code> = <code>8</code> · <code>Math.floor(100/10)</code> = <code>10</code> → <b>ต้องมี case 10 ด้วย</b> ไม่งั้นคนได้ 100 จะตกไป default เป็น F!<br>
<code>case 10:</code> กับ <code>case 9:</code> ที่ไม่มี break คือ<b>ตั้งใจให้ไหลลงไปใช้โค้ดของ case 8</b> (fall-through) = เขียนแบบ "จับกลุ่มหลาย case"<br>
<b>ข้อจำกัดที่ต้องรู้:</b> switch เทียบได้แค่ <b>ค่าตรงตัว</b> เทียบช่วง <code>&gt;=</code> ตรงๆ ไม่ได้ จึงต้องหาร 10 เพื่อยุบช่วงให้เป็นค่าเดียวก่อน — และแบบนี้<b>ดักคะแนนติดลบ/เกิน 100 ไม่ได้</b> ต้องกรองก่อนเข้า switch</p>

<h3>แบบ 6 — do...while + ตัวแปรธง แทน while(true)+break</h3>
<pre class="code">let isRunning: boolean = true
do {
    const inputStudentID: string = String(prompt("กรอกรหัส/หรือว่าออก:")).trim()
    if(inputStudentID === "ออก"){
        isRunning = false
    } else {
        // ...ตรวจสอบและบันทึกตามปกติ...
    }
} while(isRunning)</pre>
<p><b>ต่างจากเดิมยังไง:</b> <code>do...while</code> ทำ body ก่อน 1 รอบแล้วค่อยเช็คเงื่อนไข (post-test) → รับค่าอย่างน้อย 1 ครั้งเสมอ ซึ่งเหมาะกับโปรแกรมนี้พอดี (ยังไงก็ต้องถามอย่างน้อย 1 ครั้ง)<br>
<b>ข้อดี:</b> ไม่ต้องใช้ <code>break</code> ทางออกของลูปอยู่ที่เงื่อนไขท้ายลูปที่เดียว อ่านง่าย · <b>ข้อเสีย:</b> ต้องมีตัวแปรธงเพิ่ม และถ้าจะออกจากกลางลูปลึกๆ ยุ่งกว่า break</p>

<h3>🍜 test.ts (นับแคลอรี่) — เขียนใหม่ 4 แบบ</h3>
<p>ของเดิมใช้ <code>if</code> แยกกัน 4 ก้อน (ไม่ใช่ else if) — <b>ทำงานถูกแต่เปลืองการเช็ค</b> เพราะเมนูเป็น 1 ได้ทีละอย่าง เจอแล้วยังเช็คที่เหลืออีก 3 ก้อนอยู่ดี</p>
<pre class="code">// แบบ A — else if (เจอแล้วเลิกเช็คทันที)
let totalCalories: number = 0
while(true){
    const inputMenuNumber: string = String(prompt("")).trim()
    if(inputMenuNumber === "5"){ break }
    if(inputMenuNumber === "1"){ totalCalories = totalCalories + 100 }
    else if(inputMenuNumber === "2"){ totalCalories = totalCalories + 120 }
    else if(inputMenuNumber === "3"){ totalCalories = totalCalories + 200 }
    else if(inputMenuNumber === "4"){ totalCalories = totalCalories + 60 }
    else { console.log("ไม่มีเมนูนี้") }
}

// แบบ B — switch
switch(inputMenuNumber){
    case "1": totalCalories += 100; break
    case "2": totalCalories += 120; break
    case "3": totalCalories += 200; break
    case "4": totalCalories += 60;  break
    default: console.log("ไม่มีเมนูนี้")
}

// แบบ C — ตารางเมนู 2 อาร์เรย์คู่ขนาน
const menuCodes: string[] = ["1","2","3","4"]
const menuCalories: number[] = [100,120,200,60]
const foundIndex: number = menuCodes.indexOf(inputMenuNumber)
if(foundIndex === -1){ console.log("ไม่มีเมนูนี้") }
else{ totalCalories = totalCalories + menuCalories[foundIndex] }

// แบบ D — แยกเป็นฟังก์ชัน
function calorieOf(menuCode: string): number {
    if(menuCode === "1") return 100
    if(menuCode === "2") return 120
    if(menuCode === "3") return 200
    if(menuCode === "4") return 60
    return 0
}</pre>

  why:`ช่อง 0,1: ไม่เคยถูกยัดทับ → <b>const</b> (อาร์เรย์ที่ push ก็ยัง const ได้) · ช่อง 2: อยู่ในลูป สร้างใหม่ทุกรอบ → <b>const</b> · ช่อง 3: ประกาศเปล่าแล้วยัดค่าทีหลัง → <b>let</b> · ช่อง 4: <code>i++</code> = ยัดค่าใหม่ทับ → <b>let</b> (ใส่ const จะ error ทันทีรอบแรกที่ i++)` },

{ id:"L15E2", type:"mcq", title:"ชื่อตัวแปรแบบไหนที่จารย์อยากเห็น",
  brief:`<p>ตัวแปรนี้เก็บ "คะแนนรวมทั้งเทอมที่รับมาจากผู้ใช้" — ชื่อไหนดีที่สุด?</p>`,

  why:`ชื่อดี = <b>คนที่ไม่เคยเห็นโค้ดอ่านชื่อแล้วรู้ทันทีว่าข้างในคืออะไร</b> — <code>inputStudentScoreAllTerm</code> บอกครบ 3 ชั้น: <b>input</b>=มาจากผู้ใช้ · <b>StudentScore</b>=คะแนนของนักศึกษา · <b>AllTerm</b>=ทั้งเทอม<br><code>s</code>/<code>num1</code> บอกแค่ว่า "เป็นตัวเลข" ซึ่งดูจากโค้ดก็รู้อยู่แล้ว = ชื่อที่ไม่ให้ข้อมูลอะไรเพิ่ม · <code>Score2</code> ขึ้นต้นตัวใหญ่ผิดธรรมเนียม และเลข 2 ไม่ได้แปลว่าอะไร` },

{ id:"L15E4", type:"mcq", title:"ทำไม for ต้องใช้ let ไม่ใช่ const",
  brief:`<p>ถ้าเปลี่ยนลูปสรุปผลเป็น <code>for(const i = 0; i &lt; allid.length; i++)</code> จะเกิดอะไรขึ้น?</p>`,
  choices:[
    `ทำงานปกติ เพราะ i ถูกสร้างใหม่ทุกรอบ`,
    `error ตอนถึง i++ เพราะ i++ คือการยัดค่าใหม่ทับตัวแปร const`,
    `ลูปวนแค่รอบเดียวแล้วหยุด`,
    `TypeScript เตือนแต่ยังรันได้ปกติ`], ok:1,
  nudge:"i++ แปลว่า i = i + 1 — เป็นการยัดค่าใหม่ทับกล่องเดิมหรือเปล่า? แล้ว const ยอมไหม",
  why:`<code>i++</code> ก็คือ <code>i = i + 1</code> = <b>ยัดค่าใหม่ทับกล่องเดิม</b> → const ห้าม → <b>TypeError: Assignment to constant variable</b><br><b>แต่ระวังสับสน:</b> <code>for(const item of allid)</code> <b>ใช้ const ได้</b> เพราะแบบ <code>of</code> สร้างตัวแปรใหม่ทุกรอบให้เอง ไม่มีการบวกเพิ่มเอง — สองอันนี้คนละเรื่องกัน จารย์ชอบเอามาถามคู่กัน` },

{ id:"L15E5", type:"predict", title:"switch ลืม break (fall-through)",
  code:`const menu = "2"
let total = 0
switch(menu){
    case "1": total = total + 100
    case "2": total = total + 120
    case "3": total = total + 200; break
    case "4": total = total + 60; break
}
console.log(total)`,
  answer:"320",
  nudge:"case ที่ไม่มี break ท้ายบรรทัด จะไม่หยุด — มันไหลลงไปทำ case ถัดไปต่อเรื่อยๆ จนกว่าจะเจอ break ตัวแรก ลองบวกดูว่าไหลไปโดนอะไรบ้าง",
  why:`เข้าที่ <code>case "2"</code> → +120 → <b>ไม่มี break</b> → ไหลลง <code>case "3"</code> ทำ +200 ต่อ → เจอ break ถึงหยุด → รวม <b>320</b><br>นี่คือ <b>fall-through</b> — บั๊กยอดฮิตของ switch · ในแบบ 5 (หารสิบ) ที่ <code>case 10:</code> กับ <code>case 9:</code> ไม่มี break คือการ<b>จงใจ</b>ใช้ fall-through เพื่อจับกลุ่มหลาย case ให้ทำงานเดียวกัน — <b>ต้องแยกให้ออกว่าอันไหนตั้งใจ อันไหนลืม</b>` },

{ id:"L15E6", type:"mcq", title:"switch หารสิบ ทำไมต้องมี case 10",
  brief:`<p>ในเวอร์ชัน <code>switch(Math.floor(score / 10))</code> ถ้า<b>ลบ <code>case 10:</code> ทิ้ง</b> จะเกิดอะไรขึ้น?</p>
<pre class="code">switch(Math.floor(score / 10)){
    case 10:
    case 9:
    case 8:  grade = "A"; break
    case 7:  grade = "B"; break
    default: grade = "F"
}</pre>`,
  choices:[
    `ไม่มีอะไรเปลี่ยน เพราะ case 9 ครอบคลุมอยู่แล้ว`,
    `คนที่ได้ 100 คะแนนจะตกไป default ได้เกรด F`,
    `โปรแกรม error เพราะ switch ไม่ครบ case`,
    `คนที่ได้ 100 จะได้เกรด B`], ok:1,
  nudge:"ลองคำนวณ Math.floor(100 / 10) ออกมาเป็นเลขอะไร แล้วเลขนั้นตรงกับ case ไหนในโค้ด",
  why:`<code>Math.floor(100/10)</code> = <b>10</b> ไม่ใช่ 9 → ถ้าไม่มี <code>case 10</code> จะไม่ตรงกับ case ไหนเลย ตกไป <code>default</code> → <b>คนได้เต็ม 100 ได้เกรด F</b> 😱<br>บทเรียน: <b>ทุกครั้งที่ยุบช่วงเป็นค่าเดียว ต้องเช็คค่าขอบบนสุด/ล่างสุดเสมอ</b> — เป็นบั๊กประเภทเดียวกับเกิน 100 ในโค้ดจริงของมึงเลย` },

{ id:"L15E7", type:"predict", title:"ตารางเกณฑ์ (table-driven) ถ้าเรียงผิดลำดับ",
  code:`const gradeMinScores = [0, 50, 60, 70, 80]
const gradeNames = ["F", "D", "C", "B", "A"]
const score = 85
let grade = ""
for(let i = 0; i < gradeMinScores.length; i++){
    if(score >= gradeMinScores[i]){
        grade = gradeNames[i]
        break
    }
}
console.log(grade)`,
  answer:"F",
  nudge:"ลูปเจอตัวแรกที่เงื่อนไขจริงแล้ว break ทันที — ตัวแรกในตารางคือเกณฑ์ 0 แล้ว 85 >= 0 จริงไหม?",
  why:`85 เจอเกณฑ์แรกคือ <code>0</code> → <code>85 >= 0</code> <b>จริง</b> → ได้ "F" แล้ว break ออกเลย ไม่ได้ดูเกณฑ์ที่เหลือ<br><b>ตารางเกณฑ์ต้องเรียงจากมากไปน้อยเสมอ</b> <code>[80,70,60,50,0]</code> คู่กับ <code>["A","B","C","D","F"]</code> — เป็นหลักการเดียวกับที่ <code>else if</code> ต้องเรียง 80 ก่อน 70 ก่อน 60 · <b>ถ้าจารย์สลับลำดับ else if ในโค้ดมึงแล้วถามว่าเกิดอะไรขึ้น = ข้อนี้เป๊ะๆ</b>` },

{
id:"L16", icon:"🎤", always:true, title:"ห้องซ้อมโดนจารย์ยิง — Q&A + โฟลว์ชาร์ต + เขียนใส่กระดาษ", sub:"คลังคำถาม 40 ข้อพร้อมคำตอบ + โจทย์นอกโค้ดที่จารย์ชอบโยนสด",
teach: `
<div class="callout red"><b>กติกาห้องนี้: อ่านคำถาม → ตอบในใจให้จบก่อน → ค่อยกดดูเฉลย</b><br>
ถ้าแอบดูเฉลยก่อน สมองจะจำว่า "เคยเห็น" ไม่ใช่ "ตอบได้" — พรุ่งนี้ตอบไม่ออกเหมือนเดิม</div>

<h3>โปรโตคอลตอนขึ้นพรีเซนต์ (ท่องให้ขึ้นใจ)</h3>
<ol>
<li><b>เปิดด้วยภาพรวม 3 ท่อน 20 วินาที</b> — "โปรแกรมนี้รับรหัสกับคะแนนวนไปเรื่อยๆ ตรวจรหัส 3 ชั้น ตัดเกรดทันทีทีละคน พอพิมพ์ 'ออก' ก็สรุปทั้งหมดอีกครั้ง" <b>ห้ามเริ่มด้วยการไล่บรรทัดแรก</b></li>
<li><b>อธิบายทีละท่อน ไม่ใช่ทีละบรรทัด</b> — บรรทัดไหนจารย์อยากรู้เดี๋ยวแกถามเอง</li>
<li><b>พูดคำว่า "เพราะ" ทุกครั้ง</b> — "ผมใช้ while เพราะไม่รู้ล่วงหน้าว่าจะมีนักศึกษากี่คน" ดีกว่า "ตรงนี้ใช้ while ครับ"</li>
<li><b>ถ้าถูกจับผิด: ยอมรับ + บอกวิธีแก้ทันที</b> — "ใช่ครับตรงนั้นเป็นบั๊ก แก้โดย..." <b>ห้ามเถียง ห้ามเงียบ</b> คะแนนอยู่ที่วิธีคิดต่อจากนั้น</li>
<li><b>ถ้าไม่รู้จริงๆ:</b> "ผมไม่แน่ใจตรงนี้ครับ แต่ถ้าให้เดาจากที่เข้าใจคือ... ผมขอลองไล่ดูครับ" แล้วไล่ให้ดูจริง — <b>ห้ามตอบว่า "ไม่รู้ครับ" เฉยๆ แล้วหยุด</b></li>
<li><b>ให้เขียนบนกระดาน = พูดออกเสียงไปด้วยขณะเขียน</b> จารย์ให้คะแนนวิธีคิด ไม่ใช่ลายมือ</li>
</ol>

<h3>📋 คลังคำถาม 40 ข้อ — จารย์ยิงชัวร์</h3>
<p class="dim">กดที่คำถามเพื่อดูเฉลย · ตอบในใจให้จบก่อนกด</p>

<h3>ชุด A — โครงสร้างลูป</h3>
<details class="think"><summary>1. ทำไมใช้ while ไม่ใช้ for?</summary>เพราะ <b>ไม่รู้ล่วงหน้าว่าจะมีนักศึกษากี่คน</b> — for เหมาะกับกรณีที่รู้จำนวนรอบตั้งแต่ต้น (เช่นวนตามความยาวอาร์เรย์ตอนสรุปผล ผมจึงใช้ for ตรงนั้น)</details>
<details class="think"><summary>2. while(true) ไม่ใช่ลูปไม่รู้จบเหรอ ทำไมโปรแกรมถึงหยุดได้?</summary>เป็นลูปไม่รู้จบจริง แต่มี <code>break</code> อยู่ข้างในตอนผู้ใช้พิมพ์ "ออก" ซึ่งสั่งให้ออกจากลูปทันที</details>
<details class="think"><summary>3. เปลี่ยนเป็น while(1==1) ได้ไหม</summary>ได้ ผลเหมือนกันเป๊ะ เพราะ <code>1==1</code> ถูกประเมินเป็น <code>true</code> ก่อน แต่ผมเขียน <code>true</code> เพราะอ่านแล้วเห็นเจตนาทันที</details>
<details class="think"><summary>4. ถ้าเงื่อนไข while เป็นเท็จตั้งแต่แรกจะเกิดอะไร</summary>ไม่เข้าลูปเลยแม้แต่รอบเดียว (while เป็น pre-test loop เช็คก่อนเข้า) → กระโดดไปท่อนสรุป → พิมพ์ "ไม่มีผลคะแนนใดๆ"</details>
<details class="think"><summary>5. while กับ do...while ต่างกันยังไง</summary>while เช็คเงื่อนไขก่อนเข้า (อาจไม่ทำเลยสักรอบ) · do...while ทำ body ก่อน 1 รอบแล้วค่อยเช็ค (ทำอย่างน้อย 1 รอบเสมอ)</details>
<details class="think"><summary>6. เขียนใหม่โดยห้ามใช้ break ได้ไหม</summary>ได้ ใช้ตัวแปรธง: <code>let isRunning = true</code> แล้ว <code>while(isRunning){ ... if(id==="ออก"){ isRunning=false } else { ... } }</code> หรือใช้ do...while(isRunning)</details>
<details class="think"><summary>7. break กับ continue ต่างกันยังไง</summary>break = ออกจากลูปเลยไม่วนอีก · continue = ข้ามโค้ดที่เหลือในรอบนั้น กลับขึ้นไปเช็คเงื่อนไขเริ่มรอบใหม่</details>
<details class="think"><summary>8. ถ้าลบ continue ทั้งหมดออกจะเกิดอะไร</summary>โปรแกรมจะพิมพ์ข้อความเตือนแล้ว<b>ไหลลงไปถามคะแนนต่อ</b>ทั้งที่รหัสยังผิดอยู่ แล้วยัง push ข้อมูลรหัสผิดเข้าอาร์เรย์อีก — ด่านตรวจกลายเป็นแค่การเตือนที่ไม่มีผลอะไรเลย</details>
<details class="think"><summary>9. ทำไม prompt ต้องอยู่ในลูป</summary>ถ้าอยู่นอกลูปจะถามครั้งเดียว แล้ววนใช้ค่าเดิมซ้ำๆ ไม่รู้จบ เพราะไม่มีอะไรทำให้ค่าเปลี่ยนอีกเลย</details>
<details class="think"><summary>10. ลูปนี้วนกี่รอบ</summary>ไม่คงที่ — ขึ้นกับผู้ใช้ วนจนกว่าจะพิมพ์ "ออก" (รอบที่กรอกผิดก็นับเป็นรอบด้วย)</details>

<h3>ชุด B — ตัวแปร / const-let / ชนิดข้อมูล</h3>
<details class="think"><summary>11. ทำไม LINE ใช้ const</summary>เพราะไม่มีบรรทัดไหนยัดค่าใหม่ทับเลยตลอดโปรแกรม ผมใช้ const เป็นค่าตั้งต้นเสมอ แล้วเปลี่ยนเป็น let เฉพาะตัวที่ต้องยัดค่าทับจริงๆ</details>
<details class="think"><summary>12. const แต่ push ได้ยังไง</summary>const ล็อกการผูกป้ายชื่อกับกล่อง ไม่ได้ล็อกของข้างในกล่อง → push ได้ แต่ <code>allid = []</code> จะ error</details>
<details class="think"><summary>13. const อยู่ในลูปแต่ค่าเปลี่ยนทุกรอบ ทำไมไม่ error</summary>ตัวแปรที่ประกาศในปีกกาของลูปถูกสร้างใหม่ทุกรอบ (block scope) const ห้ามแค่การยัดค่าทับภายในรอบเดียวกัน</details>
<details class="think"><summary>14. เปลี่ยน const ทั้งหมดเป็น let ได้ไหม</summary>ได้ โปรแกรมยังทำงานถูกทุกอย่าง แต่เสียประโยชน์ของ const คือคนอ่านจะไม่รู้ว่าตัวไหนห้ามแก้ และถ้าเผลอแก้ก็จะไม่มีใครเตือน</details>
<details class="think"><summary>15. ทำไม for ต้องใช้ let i</summary>เพราะ <code>i++</code> คือการยัดค่าใหม่ทับ ถ้าใช้ const จะ error ทันที</details>
<details class="think"><summary>16. :string กับ :number คืออะไร ลบออกได้ไหม</summary>คือ type annotation ของ TypeScript บอกชนิดข้อมูลที่กล่องเก็บได้ · ลบออกโปรแกรมยังรันได้ (TS เดาชนิดให้เอง) แต่จะเสียการตรวจสอบตอนคอมไพล์ ซึ่งเป็นเหตุผลหลักที่ใช้ TS แทน JS</details>
<details class="think"><summary>17. string[] แปลว่าอะไร</summary>อาร์เรย์ที่ทุกช่องเก็บ string — <code>[]</code> ต่อท้ายชนิดแปลว่า "หลายตัวของชนิดนั้น"</details>
<details class="think"><summary>18. prompt() คืนค่าชนิดอะไร</summary>คืน <code>string | null</code> — null เมื่อผู้ใช้กด Cancel จึงต้องห่อ String() ก่อนใช้</details>
<details class="think"><summary>19. ทำไมต้อง Number(prompt()) ตรงคะแนน</summary>เพราะ prompt คืน string ถ้าไม่แปลง เวลาเอาไปคำนวณจะกลายเป็นการต่อข้อความ เช่น <code>"80" + 1</code> ได้ <code>"801"</code></details>
<details class="think"><summary>20. ถ้ากด Cancel ตอนถามคะแนนจะเป็นยังไง</summary><code>Number(null)</code> = <b>0</b> → ได้เกรด F โดยไม่ error — ถ้าจะกันต้องเช็ค null ก่อนแปลง</details>

<h3>ชุด C — เงื่อนไข / ตัดเกรด</h3>
<details class="think"><summary>21. === กับ == ต่างกันยังไง</summary>=== เทียบทั้งค่าและชนิด (strict) · == แปลงชนิดให้ก่อนแล้วค่อยเทียบ → <code>"5"==5</code> จริง แต่ <code>"5"===5</code> เท็จ · ในข้อสอบใช้ === เสมอ</details>
<details class="think"><summary>22. ถ้าเขียน if(x = 5) แทน if(x === 5) จะเกิดอะไร</summary>= ตัวเดียวคือการ<b>ยัดค่า</b> ไม่ใช่การเทียบ → x จะกลายเป็น 5 แล้วเงื่อนไขถูกตีเป็นจริงตลอด (เพราะ 5 เป็น truthy) — เป็นบั๊กที่<b>ไม่มี error ให้เห็น</b></details>
<details class="think"><summary>23. ทำไมชั้น else if ไม่ต้องเขียน score &lt; 80</summary>เพราะมาถึงบรรทัด else if ได้แปลว่าเงื่อนไขข้างบนเป็นเท็จไปแล้ว = รู้อยู่แล้วว่าน้อยกว่า 80 มันคือการกรองทีละชั้นจากบนลงล่าง</details>
<details class="think"><summary>24. ถ้าสลับให้ score &gt;= 0 ขึ้นไปอยู่บนสุดจะเกิดอะไร</summary><b>ทุกคนได้ F หมด</b> เพราะ else-if หยุดที่เงื่อนไขแรกที่เป็นจริง และคะแนนทุกค่าที่ไม่ติดลบก็ผ่าน <code>&gt;= 0</code> หมด</details>
<details class="think"><summary>25. ถ้าเปลี่ยน else if ทั้งหมดเป็น if เดี่ยวๆ จะเกิดอะไร</summary>คนได้ 85 จะเข้าทุกเงื่อนไขที่ผ่าน (>=80, >=70, >=60, >=50, >=0) → <b>ถูก push 5 รอบ ได้ 5 เกรด</b> และพิมพ์ผล 5 บรรทัด — else if คือสิ่งที่บังคับให้เข้าได้ทางเดียว</details>

<h3>📝 เขียนใส่กระดาษ — เช็กลิสต์กันตกหล่น (ไล่ทุกครั้งหลังเขียนเสร็จ)</h3>
<ol>
<li><b>ปีกกาครบคู่ไหม</b> — นับ <code>{</code> กับ <code>}</code> ให้เท่ากัน (เขียนกระดาษให้ย่อหน้าเข้าไปทุกชั้น จะนับง่าย)</li>
<li><b>ทุก if ใช้ <code>===</code> ไม่ใช่ <code>=</code></b> (ยกเว้น <code>&gt;= &lt;= !==</code>)</li>
<li><b>ค่าที่รับมาแล้วต้องคำนวณ ห่อ <code>Number()</code> หรือยัง</b></li>
<li><b>ค่าที่เอาไปเทียบข้อความ ครอบเครื่องหมายคำพูดหรือยัง</b> — <code>menu === "1"</code> ไม่ใช่ <code>menu === 1</code></li>
<li><b>ลูปมีทางออกไหม</b> — while(true) ต้องมี break · for ต้องมี i++</li>
<li><b>ถังสะสมประกาศไว้นอกลูปหรือเปล่า</b> — ถ้าประกาศในลูปจะถูกรีเป็น 0 ทุกรอบ</li>
<li><b>ประกาศตัวแปรก่อนใช้ทุกตัว</b> และเลือก const/let ให้ถูก</li>
<li><b>ข้อความ output สะกดตรงกับที่โจทย์ให้เป๊ะไหม</b> (เว้นวรรค ตัวใหญ่-เล็ก จุดจบประโยค)</li>
</ol>

<h3>🎯 โจทย์นอกโค้ดที่จารย์ชอบโยนสด — จำ "โครง" ไว้ ไม่ต้องจำโค้ด</h3>
<table>
<tr><th>โจทย์</th><th>โครงที่ใช้</th></tr>
<tr><td>รวมเลข / นับจำนวน</td><td>ถังเริ่ม 0 นอกลูป → <code>sum = sum + x</code> ในลูป → พิมพ์หลังลูป</td></tr>
<tr><td>หาค่ามากสุด</td><td>ตั้งแชมป์ = ตัวแรก (<b>ห้ามเริ่ม 0</b>) → เจอตัวมากกว่าก็เปลี่ยนแชมป์</td></tr>
<tr><td>ค่าเฉลี่ย</td><td>ถังผลรวม + ถังนับ → <code>sum / count</code> (<b>ต้องกัน count = 0</b>)</td></tr>
<tr><td>แกะหลักเลข</td><td><code>n % 10</code> = หลักสุดท้าย · <code>Math.floor(n/10)</code> = ตัดหลักสุดท้ายทิ้ง · วนจน n = 0</td></tr>
<tr><td>เลขคู่/คี่ · หารลงตัว</td><td><code>n % 2 === 0</code> · <code>a % b === 0</code></td></tr>
<tr><td>กลับข้อความ</td><td>ถัง <code>""</code> → วนจากท้ายมาหน้า <code>out = out + s[i]</code></td></tr>
<tr><td>นับตัวอักษรบางตัว</td><td>ถังนับ 0 → วนทุก index → ถ้าตรงก็ +1</td></tr>
<tr><td>สูตรคูณ / ตาราง</td><td>ลูปซ้อนลูป: ลูปนอก = แถว · ลูปใน = คอลัมน์</td></tr>
<tr><td>พีระมิดดาว</td><td>ลูปนอก = บรรทัด · ลูปใน = ต่อดาวใส่ถัง string → พิมพ์ท้ายแต่ละบรรทัด</td></tr>
<tr><td>จำนวนเฉพาะ</td><td>วนหารตั้งแต่ 2 ถึง n-1 เจอตัวหารลงตัว = ไม่ใช่ (ใช้ธง boolean + break)</td></tr>
<tr><td>สลับค่า 2 ตัวแปร</td><td>ต้องมีตัวพักที่ 3: <code>t=a; a=b; b=t</code></td></tr>
<tr><td>เมนูวนซ้ำ</td><td>while(true) + break ที่เลข sentinel — <b>คือ test.ts ของมึงเป๊ะ</b></td></tr>
</table>

<h3>กฎข้อ 1 ที่ต้องรู้ก่อนทุกอย่าง: ของบางตัว "คืนของใหม่" บางตัว "แก้ของเดิม"</h3>
<pre class="code">// string แก้ไม่ได้ตลอดกาล (immutable) — method ทุกตัวคืนก้อนใหม่เสมอ
let s = "hello"

s = s.toUpperCase()    // ✅ ต้องยัดกลับเข้าตัวแปรเอง
console.log(s)         // HELLO

// array แก้ได้ — บาง method แก้ของเดิมเลย (mutate)
const a = [3, 1, 2]
a.sort()               // ไม่ต้องยัดกลับ a เปลี่ยนไปแล้วจริงๆ
console.log(a)         // 1,2,3</pre>

<h3>⚠️ 12 กับดักที่ออกสอบบ่อยที่สุด</h3>
<ol>
<li><b><code>[10,9,1].sort()</code> ได้ <code>1,10,9</code></b> เพราะ sort เรียงแบบ<b>ข้อความ</b>โดยปริยาย ("10" มาก่อน "9" เพราะเทียบตัวอักษรตัวแรก) → เรียงเลขต้องใส่ <code>(x,y)=&gt;x-y</code></li>
<li><b><code>.replace()</code> เปลี่ยนแค่ตัวแรก</b> — จะเปลี่ยนหมดต้อง <code>.replaceAll()</code> หรือวนลูป</li>
<li><b><code>.toFixed()</code> คืน string</b> → <code>(1.5).toFixed(1) + 1</code> ได้ <code>"1.51"</code> ไม่ใช่ 2.5</li>
<li><b><code>parseInt("12abc")</code> = 12</b> แต่ <code>Number("12abc")</code> = NaN — ถ้าอยาก<b>ตรวจว่าเป็นเลขล้วนจริง</b>ต้องใช้ Number ไม่ใช่ parseInt</li>
<li><b><code>.indexOf()</code> ไม่เจอคืน <code>-1</code> ไม่ใช่ false</b> → ต้องเขียน <code>if(a.indexOf(x) === -1)</code> ห้ามเขียน <code>if(!a.indexOf(x))</code> (เพราะช่อง 0 จะกลายเป็นเท็จ!)</li>
<li><b><code>.reverse()</code> และ <code>.sort()</code> แก้อาร์เรย์เดิม</b> — ถ้าอยากเก็บของเดิมไว้ต้อง <code>[...a].sort()</code> หรือ <code>a.slice().sort()</code></li>
<li><b><code>slice</code> ไม่แก้ของเดิม · <code>splice</code> แก้</b> — ชื่อต่างกันตัวเดียว ผลต่างกันคนละเรื่อง</li>
<li><b>string method ไม่แก้ตัวเดิม</b> — <code>s.toUpperCase()</code> เฉยๆ ไม่มีผล ต้อง <code>s = s.toUpperCase()</code></li>
<li><b><code>"abc".charAt(99)</code> ได้ <code>""</code> แต่ <code>"abc"[99]</code> ได้ <code>undefined</code></b></li>
<li><b><code>Math.round(-2.5)</code> = -2 ไม่ใช่ -3</b> (.5 ปัดไปทางบวกเสมอ)</li>
<li><b><code>Math.max([1,5,3])</code> = NaN</b> — มันรับหลายอาร์กิวเมนต์ ไม่ใช่อาร์เรย์ ต้อง <code>Math.max(...[1,5,3])</code></li>
<li><b><code>.length</code> ไม่มีวงเล็บ</b> ส่วน method ต้องมี — <code>s.length()</code> = error · <code>s.trim</code> เฉยๆ = ได้ตัวฟังก์ชันมาแต่ไม่ได้กด</li>
</ol>

<h3>🤝 คู่หูที่ใช้บ่อยที่สุด: split + join</h3>
<pre class="code">const text: string = "10,9,1"

const parts: string[] = text.split(",")     // ["10","9","1"]  ข้อความ → อาร์เรย์
const joined: string = parts.join(" | ")    // "10 | 9 | 1"    อาร์เรย์ → ข้อความ

// ท่ารวมเลขที่คั่นด้วยคอมมา (โจทย์คลาสสิก)
let sum: number = 0
for(let i = 0; i &lt; parts.length; i++){
    sum = sum + Number(parts[i])            // อย่าลืม! split ได้ "ข้อความ" เสมอ
}
console.log(sum)                            // 20

  why:`ท่านับ + ไล่ทีละตัวอักษร = โจทย์ที่โผล่บ่อยมาก (นับสระ · นับช่องว่าง · นับเลขคู่ในข้อความ) โครงเดียวกันหมด<br><b>ท่าลัดที่ควรรู้ไว้อวด:</b> <code>text.split(ch).length - 1</code> ก็ได้คำตอบเดียวกัน (หั่นด้วยตัวนั้นได้กี่ชิ้น ก็แปลว่ามีตัวคั่นน้อยกว่าชิ้นอยู่ 1) — <b>แต่ในห้องสอบเขียนลูปจะปลอดภัยกว่า เพราะอธิบายได้ทุกก้าว</b>` },

{ id:"L17E15", type:"mcq", title:"อยากเรียงโดยไม่พังอาร์เรย์เดิม",
  brief:`<p>มึงต้องพิมพ์คะแนน <b>เรียงจากมากไปน้อย</b> แต่ <code>allscore</code> ตัวเดิมต้องยัง<b>เรียงตามลำดับที่กรอก</b>เหมือนเดิม (เพราะต้องใช้คู่กับ index ของ allid) — ต้องเขียนยังไง?</p>`,
  choices:[
    `allscore.sort((x, y) => y - x)`,
    `allscore.slice().sort((x, y) => y - x)`,
    `allscore.reverse()`,
    `allscore.sort()`], ok:1,
  nudge:"sort แก้อาร์เรย์เดิมทันที — ต้องหาวิธี 'ก๊อปก่อนเรียง' แล้วท่าไหนที่ทำสำเนาโดยไม่แตะของเดิม",
  why:`<code>.sort()</code> <b>แก้อาร์เรย์เดิม</b> → ถ้าเรียงตรงๆ index ของ allscore จะไม่ตรงกับ allid อีกต่อไป = <b>ข้อมูลสลับคนทันที</b> (ตรงกับความเสี่ยงของ 3 อาร์เรย์คู่ขนานที่คุยกันในด่าน 15 เป๊ะ)<br><code>.slice()</code> เปล่าๆ = คัดลอกทั้งอาร์เรย์ออกมาเป็นก้อนใหม่ → เรียงก้อนใหม่ ของเดิมปลอดภัย (เขียน <code>[...allscore].sort(...)</code> ก็ได้เหมือนกัน)<br><code>.reverse()</code> แค่กลับหลัง<b>ไม่ได้เรียง</b> และแก้ของเดิมด้วย · <code>.sort()</code> เปล่าๆ เรียงแบบข้อความ<br><b>ข้อนี้เอาไปตอบได้เลยถ้าจารย์ถามว่า "ถ้าอยากเรียงคะแนนจากมากไปน้อยจะทำยังไง"</b>` },

{ id:"L17E16", type:"blank", title:"ตัวไหนแก้ของเดิม ตัวไหนคืนของใหม่",
  brief:`<p>เติมว่าแต่ละ method <b>แก้อาร์เรย์เดิม</b> หรือ <b>คืนก้อนใหม่</b> — จำผิดข้อเดียวคือข้อมูลเพี้ยนแบบไม่มี error เตือน</p>`,

  ],
  nudge:`ท่องคาถา: "sort reverse splice = ตัวแสบ 3 ตัวที่แอบแก้ของเดิม" (บวก push pop shift unshift ที่ชัดเจนอยู่แล้วว่าแก้) · ส่วน string ไม่มีทางแก้ตัวเองได้เลยสักตัว`,
  why:`สรุปให้จำทั้งชีวิต:<br>• <b>array แก้ของเดิม:</b> <code>push pop shift unshift sort reverse splice</code><br>• <b>array คืนก้อนใหม่:</b> <code>slice concat join map filter</code><br>• <b>string:</b> <b>คืนก้อนใหม่ทุกตัว 100%</b> ไม่มีข้อยกเว้น<br>ทำไมสำคัญ: ตัวที่ "คืนก้อนใหม่" ถ้าลืมรับค่ากลับ = <b>โค้ดรันผ่านแต่ไม่มีอะไรเกิดขึ้น</b> ส่วนตัวที่ "แก้ของเดิม" ถ้าเผลอเรียก = <b>ข้อมูลเดิมพังโดยไม่มี error เตือน</b> — สองแบบนี้คือบั๊กเงียบที่หายากที่สุด` },

]},


/* ================= LA2 : สนามสอบ 3 — ชุด A2 (TOI National Grader) ================= */
{
id:"LA2", icon:"🐰", always:true, title:"สนามสอบ 3 — ชุด A2 กระต่ายน้อย", sub:"โจทย์จริง TOI-Zero ชุด A2 · 19 ข้อ: เงื่อนไข · ลูป · string · array · ตาราง 2 มิติ",
teach: `
<div class="callout"><b>ชุดนี้คือโจทย์จริงจากชีท TOI A2</b> (แพลตฟอร์ม TOI National Grader) — คนละชุดกับ A1 ที่อยู่ด่าน 12/13 ระดับยากขึ้นมาอีกขั้น แต่<b>ท่าที่ใช้คือของเดิมทั้งหมด</b> ที่เรียนมาตั้งแต่ด่าน 0</div>

<h3>ฟอร์แมตของชุด A2 ต่างจาก A1 ตรงไหน</h3>
<p>A1 ส่วนใหญ่รับค่าทีละตัว แต่ <b>A2 รับเป็น "บรรทัด" และหนึ่งบรรทัดมักมีหลายค่าคั่นด้วยเว้นวรรค</b> — ท่าบังคับของชุดนี้จึงมีอยู่ท่าเดียว:</p>
<pre class="code">// รับหนึ่งบรรทัด แล้วหั่นด้วยเว้นวรรค
const p = prompt().trim().split(" ")
const a = Number(p[0])
const b = Number(p[1])

// ถ้าเว้นวรรคอาจติดกันหลายตัว ให้ใช้ตัวหั่นแบบทนกว่า
const p2 = prompt().trim().split(/\\s+/)

// ทั้งบรรทัดเป็นตัวเลขล้วน แปลงทีเดียวทั้งแถว
const nums = prompt().trim().split(/\\s+/).map(Number)</pre>
<p class="dim"><code>.trim()</code> ตัดช่องว่าง/ขึ้นบรรทัดหัวท้ายทิ้ง — <b>ใส่ไว้ก่อนเสมอ</b> เพราะข้อมูลจริงมีช่องว่างท้ายบรรทัดติดมาบ่อยมาก แล้วมันทำให้เทียบ string ไม่ตรงแบบหาสาเหตุไม่เจอ</p>

<h3>อ่านหลายบรรทัด = เรียก prompt() หลายครั้ง</h3>
<pre class="code">const n = Number(prompt())        // บรรทัดแรก: จำนวนรอบ
for (let i = 0; i &lt; n; i++) {
  const line = prompt().trim()    // อีก n บรรทัด
  // ...
}</pre>
<div class="callout red"><b>กับดักอันดับ 1 ของชุดนี้:</b> จำนวนครั้งที่เรียก <code>prompt()</code> ต้อง<b>ตรงกับจำนวนบรรทัดของ input เป๊ะ</b> เรียกขาดไปหนึ่ง = ค่าเลื่อนกันทั้งข้อ · เรียกเกิน = ได้ <code>null</code> แล้ว <code>Number(null)</code> กลายเป็น <code>0</code> เงียบๆ ไม่ error ให้จับ</div>

<h3>พิมพ์คำตอบ</h3>
<p>โจทย์ที่ตอบหลายบรรทัด = เรียก <code>console.log()</code> หลายครั้ง · โจทย์ที่ตอบเป็นแถวเดียวคั่นเว้นวรรค = <b>เก็บใส่ array แล้ว join</b></p>
<pre class="code">console.log(out.join(" "))   // อย่าพิมพ์ทีละตัวแล้วหวังว่ามันจะต่อกันเอง</pre>
`,

{ id:"A2a", type:"write", title:"ข้อ 1 — ตัวเลขไม่ซ้ำกัน (A2-011)", mode:"io", xp:30,
